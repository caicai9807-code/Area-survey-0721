<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计划外普查任务管理 - 面积普查管理系统</title>
  <link rel="stylesheet" href="pc-template-base.css">
  <style>
    .page-subtitle {
      margin: 4px 0 18px;
      color: var(--muted);
      font-size: 13px;
    }
    .progress-wrap { min-width: 132px; }
    .progress-text {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: #5b6880;
      font-size: 13px;
    }
    .progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf1f7;
    }
    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
    }
    .progress-bar.done { background: var(--success); }
    .reason-tag {
      display: inline-flex;
      padding: 4px 9px;
      border-radius: 4px;
      background: #f5f7fb;
      color: #66748c;
      font-size: 12px;
    }
    .empty-state {
      padding: 54px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty-icon {
      display: block;
      margin-bottom: 10px;
      font-size: 32px;
    }
    .filter-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(260px, 1fr));
      gap: 18px 24px;
      align-items: end;
    }
    .filter-grid-4 .field {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-grid-4 .field label {
      white-space: nowrap;
      margin-bottom: 0;
      flex-shrink: 0;
    }
    .filter-grid-4 .field .control {
      flex: 1;
      min-width: 0;
    }
    .menu-parent {
      font-weight: 700 !important;
      cursor: pointer;
      white-space: nowrap;
      padding-top: 14px !important;
      padding-bottom: 14px !important;
    }
    .menu-arrow {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .menu-arrow.collapsed {
      transform: rotate(-180deg);
    }
    .menu-child {
      padding: 14px 20px 14px 32px !important;
      white-space: nowrap;
    }
    .menu-collapsed {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">&#x25A6;</div>
        <span>面积普查管理系统</span>
        <span class="chip" style="background:rgba(255,255,255,0.15);font-weight:600;">原型环境</span>
      </div>
      <div class="top-actions">
        <div class="top-dropdown">
          <span class="top-label">演示身份:</span> 计划管理部/业务管理员 <span style="font-size:10px;margin-left:2px;">&#x25BC;</span>
        </div>
        <div class="avatar">张</div>
        <span>张敏</span>
      </div>
    </header>
    <div class="body">
      <aside class="sidebar">
        <div class="menu-section">
          <a class="menu-item menu-parent" href="#" onclick="return false">
            <span class="menu-icon">&#x25A3;</span> 计划外面积普查
            <span class="menu-arrow" id="menuArrow">&#x25B2;</span>
          </a>
          <a class="menu-item active menu-child" href="plan-outside-survey-task-list.html">
            <span class="menu-icon" style="visibility:hidden">&#x25A3;</span> 计划外普查任务管理
          </a>
          <a class="menu-item menu-child" href="plan-outside-survey-task-items.html">
            <span class="menu-icon" style="visibility:hidden">&#x25A3;</span> 计划外普查任务
          </a>
          <a class="menu-item menu-child" href="plan-outside-survey-task-worker.html">
            <span class="menu-icon" style="visibility:hidden">&#x25A3;</span> 我的计划外普查任务
          </a>
        </div>
      </aside>
      <main class="main">
        <nav class="breadcrumb"><a href="#">首页</a><span>/</span><a href="#">计划外面积普查管理</a><span>/</span><span>计划外普查任务管理</span></nav>

        <div class="page-header-row">
          <div>
            <div class="page-title" style="font-size:20px;font-weight:700;color:var(--text);margin:0 0 4px;">
              计划外普查任务管理
              <span class="page-tag">全部任务</span>
            </div>
            <p class="page-subtitle">统一查看计划外面积普查任务进度、站点完成情况和面积变化情况</p>
          </div>
          <button class="btn primary" id="createBtn">+ 新建计划外普查任务</button>
        </div>

        <section class="card">
          <div class="card-header"><div class="card-title">筛选条件</div></div>
          <div class="card-body">
            <div class="filter-grid-4">
              <div class="field"><label for="taskName">任务名称</label><input class="control" id="taskName" placeholder="请输入任务名称"></div>
              <div class="field"><label for="reason">普查原因</label><select class="control" id="reason"><option value="">全部</option><option>面积变化</option><option>一管到户</option><option>新开户及增容</option><option>趸售用户</option></select></div>
              <div class="field"><label for="department">所属管理部</label><select class="control" id="department"><option value="">全部</option><option>桥西管理部</option><option>裕华管理部</option><option>长安管理部</option></select></div>
              <div class="field"><label for="status">任务状态</label><select class="control" id="status"><option value="">全部</option><option>待分配</option><option>进行中</option><option>片区所审核</option><option>管理部审核</option></select></div>
              <div class="field"><label for="startDate">开始时间</label><input class="control" id="startDate" type="date"></div>
              <div class="field"><label for="endDate">结束时间</label><input class="control" id="endDate" type="date"></div>
              <div class="btn-row" style="grid-column:4;justify-self:end;">
                <button class="btn" id="resetBtn">重置</button>
                <button class="btn primary" id="searchBtn">查询</button>
              </div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <div class="card-title">任务列表 <span class="card-title-sub" id="countSub">共 13 条任务</span></div>
            <div class="btn-row">
              <button class="btn" id="refreshBtn">刷新</button>
            </div>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>序号</th><th>任务名称</th><th>普查原因</th><th>站点数</th>
                  <th>所属管理部</th><th>开始时间</th><th>结束时间</th>
                  <th>任务完成统计</th><th>有面积变化站点数</th>                  <th>任务状态</th>
                  <th>审核状态</th><th>最近操作时间</th>
                  <th>创建人</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="taskTableBody"></tbody>
            </table>
          </div>
          <div class="pagination">
            <div class="page-left"><span id="totalText">共 13 条</span><span>每页 5 条</span></div>
            <div class="page-box" id="paginationBox"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const tasks = [
      { id:'OUT-2026-002', name:'2026年楼安路片区面积变化调…', reason:'面积变化', sites:6, dept:'桥西管理部', start:'2026-07-18', end:'2026-07-31', done:0, changed:2, status:'进行中', distribute:'已下发', audit:'未审核', lastOp:'2026-07-18 14:30', creator:'张' },
      { id:'OUT-2026-003', name:'裕华东路用户一管到户审查', reason:'一管到户', sites:4, dept:'裕华管理部', start:'2026-07-16', end:'2026-08-08', done:0, changed:0, status:'待分配', distribute:'未下发', audit:'未审核', lastOp:'2026-07-16 09:15', creator:'孙' },
      { id:'OUT-2026-004', name:'裕华区新建项目开户面积核查', reason:'新开户及增容', sites:5, dept:'裕华管理部', start:'2026-07-12', end:'2026-07-28', done:0, changed:1, status:'片区所审核', distribute:'已下发', audit:'片区审核中', lastOp:'2026-07-15 16:20', creator:'张' },
      { id:'OUT-2026-005', name:'长安区延售用户项目集中审查', reason:'趸售用户', sites:3, dept:'长安管理部', start:'2026-07-09', end:'2026-08-20', done:0, changed:1, status:'管理部审核', distribute:'已下发', audit:'管理部审核中', lastOp:'2026-07-14 10:05', creator:'陈' },
      { id:'OUT-2026-006', name:'桥西区新增用热户面积核查', reason:'新开户及增容', sites:7, dept:'桥西管理部', start:'2026-07-14', end:'2026-08-14', done:2, changed:0, status:'待分配', distribute:'未下发', audit:'未审核', lastOp:'2026-07-14 11:30', creator:'李' },
      { id:'OUT-2026-007', name:'裕华东路片区面积异动核查', reason:'面积变化', sites:3, dept:'裕华管理部', start:'2026-06-20', end:'2026-07-10', done:3, changed:2, status:'片区所审核', distribute:'已下发', audit:'片区审核通过', lastOp:'2026-07-10 17:45', creator:'王' },
      { id:'OUT-2026-008', name:'长安路片区供热关系调整核查', reason:'一管到户', sites:6, dept:'长安管理部', start:'2026-07-01', end:'2026-07-25', done:2, changed:1, status:'进行中', distribute:'已下发', audit:'未审核', lastOp:'2026-07-20 08:50', creator:'刘' },
      { id:'OUT-2026-009', name:'桥西区供暖管网接入普查', reason:'新开户及增容', sites:8, dept:'桥西管理部', start:'2026-07-05', end:'2026-08-05', done:0, changed:0, status:'待分配', distribute:'未下发', audit:'未审核', lastOp:'2026-07-05 14:20', creator:'赵' },
      { id:'OUT-2026-010', name:'裕华区用户面积延审项目', reason:'趸售用户', sites:2, dept:'裕华管理部', start:'2026-07-08', end:'2026-07-22', done:0, changed:0, status:'片区所审核', distribute:'已下发', audit:'片区审核中', lastOp:'2026-07-12 15:30', creator:'周' },
      { id:'OUT-2026-011', name:'长安区新建安置房面积核查', reason:'新开户及增容', sites:5, dept:'长安管理部', start:'2026-07-10', end:'2026-08-01', done:0, changed:0, status:'待分配', distribute:'未下发', audit:'未审核', lastOp:'2026-07-10 10:00', creator:'孙' },
      { id:'OUT-2026-012', name:'桥西区老旧管网改造面积', reason:'面积变化', sites:9, dept:'桥西管理部', start:'2026-06-15', end:'2026-07-05', done:9, changed:6, status:'管理部审核', distribute:'已下发', audit:'管理部审核通过', lastOp:'2026-07-05 16:00', creator:'陈' },
      { id:'OUT-2026-013', name:'裕华东路二期面积核查', reason:'趸售用户', sites:4, dept:'裕华管理部', start:'2026-07-11', end:'2026-07-31', done:1, changed:0, status:'进行中', distribute:'已下发', audit:'未审核', lastOp:'2026-07-19 11:25', creator:'张' }
    ];

    const pageSize = 5;
    let result = [...tasks];
    let currentPage = 1;

    function esc(value) {
      return String(value).replace(/[&<>'"]/g, function(c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c];
      });
    }

    function statusClass(status) {
      var map = {
        '待分配': 'status-unassigned',
        '进行中': 'status-progress',
        '片区所审核': 'status-zone-review',
        '管理部审核': 'status-dept-review'
      };
      return map[status] || 'status-draft';
    }

    function render() {
      var totalPages = Math.max(1, Math.ceil(result.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      var rows = result.slice((currentPage - 1) * pageSize, currentPage * pageSize);

      document.getElementById('countSub').textContent = '共 ' + result.length + ' 条任务';
      document.getElementById('totalText').textContent = '共 ' + result.length + ' 条';

      var tbody = document.getElementById('taskTableBody');
      if (rows.length) {
        tbody.innerHTML = rows.map(function(t, i) {
          var index = (currentPage - 1) * pageSize + i + 1;
          var rate = Math.round(t.done / t.sites * 100);
          var barClass = (t.done === t.sites) ? 'done' : '';
          var statusTag = '<span class="status-tag ' + statusClass(t.status) + '">' + esc(t.status) + '</span>';
          return '<tr>' +
            '<td>' + index + '</td>' +
            '<td><strong>' + esc(t.name) + '</strong></td>' +
            '<td><span class="reason-tag">' + esc(t.reason) + '</span></td>' +
            '<td>' + t.sites + '</td>' +
            '<td>' + esc(t.dept) + '</td>' +
            '<td>' + t.start + '</td>' +
            '<td>' + t.end + '</td>' +
            '<td><div class="progress-wrap"><div class="progress-text"><span>' + t.done + ' / ' + t.sites + '</span><span>' + rate + '%</span></div><div class="progress-track"><div class="progress-bar ' + barClass + '" style="width:' + rate + '%"></div></div></div></td>' +
            '<td>' + t.changed + '</td>' +
            '<td>' + statusTag + '</td>' +
            '<td>' + esc(t.audit || '-') + '</td>' +
            '<td>' + esc(t.lastOp || '-') + '</td>' +
            '<td>' + esc(t.creator) + '</td>' +
            '<td><div class="action-row"><a class="action-link" href="plan-outside-survey-task-detail.html?id=' + encodeURIComponent(t.id) + '">详情</a><a class="action-link" href="plan-outside-survey-task-edit.html?id=' + encodeURIComponent(t.id) + '">编辑</a></div></td>' +
            '</tr>';
        }).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="14"><div class="empty-state"><span class="empty-icon">&#x2315;</span>暂无匹配任务，请调整筛选条件后重试。</div></td></tr>';
      }

      var box = document.getElementById('paginationBox');
      var html = '';
      html += '<button class="page-btn text" ' + (currentPage === 1 ? 'disabled' : '') + ' data-page="' + (currentPage - 1) + '">上一页</button>';
      for (var p = 1; p <= totalPages; p++) {
        html += '<button class="page-number ' + (p === currentPage ? 'active' : '') + '" data-page="' + p + '">' + p + '</button>';
      }
      html += '<button class="page-btn text" ' + (currentPage === totalPages ? 'disabled' : '') + ' data-page="' + (currentPage + 1) + '">下一页</button>';
      box.innerHTML = html;
    }

    function doSearch() {
      var nameVal = document.getElementById('taskName').value.trim().toLowerCase();
      var reasonVal = document.getElementById('reason').value;
      var statusVal = document.getElementById('status').value;
      var deptVal = document.getElementById('department').value;
      var startVal = document.getElementById('startDate').value;
      var endVal = document.getElementById('endDate').value;

      result = tasks.filter(function(t) {
        if (nameVal && t.name.toLowerCase().indexOf(nameVal) === -1) return false;
        if (reasonVal && t.reason !== reasonVal) return false;
        if (statusVal && t.status !== statusVal) return false;
        if (deptVal && t.dept !== deptVal) return false;
        if (startVal && t.start < startVal) return false;
        if (endVal && t.end > endVal) return false;
        return true;
      });
      currentPage = 1;
      render();
    }

    document.getElementById('searchBtn').addEventListener('click', doSearch);
    document.getElementById('resetBtn').addEventListener('click', function() {
      var inputs = document.querySelectorAll('.filter-grid-4 input');
      for (var i = 0; i < inputs.length; i++) { inputs[i].value = ''; }
      var selects = document.querySelectorAll('.filter-grid-4 select');
      for (var j = 0; j < selects.length; j++) { selects[j].value = ''; }
      result = tasks.slice();
      currentPage = 1;
      render();
    });
    document.getElementById('refreshBtn').addEventListener('click', function() {
      result = tasks.slice();
      currentPage = 1;
      render();
    });
    document.getElementById('paginationBox').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-page]');
      if (btn && !btn.disabled) {
        currentPage = Number(btn.dataset.page);
        render();
      }
    });
    document.getElementById('createBtn').addEventListener('click', function() {
      location.href = 'plan-outside-survey-task-create.html';
    });

    var filterInputs = document.querySelectorAll('.filter-grid-4 input');
    for (var k = 0; k < filterInputs.length; k++) {
      filterInputs[k].addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doSearch();
      });
    }

    var menuParent = document.querySelector('.menu-parent');
    var subItems = document.querySelectorAll('.menu-child');
    var menuArrow = document.getElementById('menuArrow');
    menuParent.addEventListener('click', function() {
      menuArrow.classList.toggle('collapsed');
      for (var m = 0; m < subItems.length; m++) {
        subItems[m].classList.toggle('menu-collapsed');
      }
    });

    render();
  </script>
</body>
</html>
